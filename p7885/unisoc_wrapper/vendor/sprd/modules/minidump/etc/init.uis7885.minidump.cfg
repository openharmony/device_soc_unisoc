{
    "jobs" : [{
            "name" : "boot",
            "cmds" : [
                "chown system system /data/log/bbox",
                "chown system system /dev/block/by-name/sysdumpdb",
                "chmod 0666 /dev/block/by-name/sysdumpdb",
                "chmod 0666 /dev/block/mmcblk0p58",
                "start minidump"
            ]
        }
    ],
    "services" : [{
            "name" : "minidump",
            "path" : ["/vendor/bin/minidumpd"],
            "importance" : -10,
            "uid" : "system",
            "gid" : ["system", "log", "readproc"],
            "start-mode" : "condition",
            "caps" : ["SYS_NICE"],
            "once" : 1,
            "secon" : "u:r:init:s0"
        }
    ]
}